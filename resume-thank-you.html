<!doctype html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=1180, initial-scale=0.333333"
    >

    <meta
        name="description"
        content="Thank you for submitting your resume to Golden Touch Cleaning Service."
    >

    <link rel="shortcut icon" href="./assets/il.png" type="image/x-icon">

    <title>Resume Submitted | Golden Touch Cleaning</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <main class="thank-you">

        <div class="thank-you-card">

            <div
                class="thank-you-icon"
                aria-hidden="true"
            >
                ✓
            </div>


            <span class="section-label">
                GOLDEN TOUCH CLEANING
            </span>


            <h1>
                Resume Received!
            </h1>


            <p>
                Your resume has been successfully submitted.
            </p>


            <p>
                Thank you for your interest in joining
                Golden Touch Cleaning Service. We will review
                your resume and contact you if there is a suitable opportunity.
            </p>


            <a
                href="index.html"
                class="btn btn-primary"
            >
                Back to Home
            </a>

        </div>

    </main>


    <script>
        const currentYear = document.getElementById("currentYear");

        if (currentYear) {
            currentYear.textContent = new Date().getFullYear();
        }
    </script>

</body>

</html>
